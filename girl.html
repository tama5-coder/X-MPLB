<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>X MPLB - GIRL Moments</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace, sans-serif; 
            background: linear-gradient(to bottom, #ff99cc, #ffccff); 
            background-attachment: fixed;
            margin: 0; padding: 0; color: #333; 
        }
        nav { 
            background-color: #e52521; padding: 15px; display: flex; justify-content: center; 
            flex-wrap: wrap; gap: 15px; position: sticky; top: 0; z-index: 1000; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); border-bottom: 4px solid #000;
        }
        nav a { 
            color: #f8d000; text-decoration: none; font-weight: bold; font-size: 1.1rem; 
            padding: 10px 20px; background: #000; border-radius: 4px; border: 2px solid #f8d000; 
            transition: 0.2s; cursor: pointer; 
        }
        nav a:hover { background: #f8d000; color: #000; }
        .container { 
            max-width: 950px; margin: 30px auto; background: #fff8eb; padding: 20px 40px; 
            border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); border: 4px solid #e52521;
            text-align: center;
        }
        h1 { color: #e52521; text-shadow: 2px 2px #f8d000; font-size: 2.3rem; margin-bottom: 10px; }
        .sub-heading { color: #e52521; margin: 20px 0 25px; font-size: 1.3rem; font-weight: bold; background: #f8d000; padding: 8px 25px; border-radius: 20px; display: inline-block; border: 2px solid #000; }
        
        .grid-kebersamaan { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 20px; margin-top: 20px; text-align: center; 
        }
        .card-kebersamaan { 
            background: #ffe6cc; padding: 12px; border-radius: 12px; 
            border: 3px solid #e52521; box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
        }
        .card-kebersamaan img { 
            width: 100%; height: 160px; object-fit: cover; 
            border-radius: 8px; border: 2px solid #f8d000; 
        }
        .card-kebersamaan p { margin: 10px 0 0; font-size: 0.9rem; font-weight: bold; color: #b22222; }
    </style>
</head>
